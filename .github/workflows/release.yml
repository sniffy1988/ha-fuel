name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build HACS zip
        run: |
          cd custom_components/ukr_fuel
          zip -r ../../ukr_fuel.zip . -x '*.pyc' '*__pycache__*'
          unzip -l ../../ukr_fuel.zip | grep -E 'manifest.json'

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ukr_fuel.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
